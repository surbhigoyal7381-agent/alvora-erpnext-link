name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        env:
          PRIVACY_FORBIDDEN_NAMES: ${{ secrets.PRIVACY_FORBIDDEN_NAMES }}
      - run: pnpm test:ember
        env:
          CI: 'true'

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, intl, bcmath, gmp, zip, pdo_mysql
      - run: composer validate
      - run: composer install --prefer-dist --no-progress
      - run: composer test:lint
      - run: composer test:unit -- --testsuite unit
